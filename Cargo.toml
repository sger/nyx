[workspace]
resolver = "3"
members = ["crates/nyx-core", "crates/nyx-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
minijinja = { version = "3.0.0", features = ["serde"] }
nyx-core = { path = "crates/nyx-core", version = "0.1.0" }
insta = "1.49.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }
walkdir = "2.5.0"
